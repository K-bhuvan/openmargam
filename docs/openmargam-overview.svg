<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">How OpenMargam helps</title>
  <desc id="description">A decision and its constraints lead to relevant human context, better questions, and a choice that remains yours.</desc>
  <rect width="1200" height="440" rx="28" fill="#faf9f5"/>
  <rect x="1" y="1" width="1198" height="438" rx="27" fill="none" stroke="#171715" stroke-opacity="0.13" stroke-width="2"/>

  <g transform="translate(54 48) scale(.19)">
    <rect width="512" height="512" rx="54" fill="#141413"/>
    <circle cx="160" cy="150" r="46" fill="#d97757"/>
    <circle cx="352" cy="150" r="46" fill="#f4d77a"/>
    <path fill="#d97757" d="M64 448V310c0-58 47-105 105-105h55v70c0 34-11 66-33 92-31 37-73 64-127 81Z"/>
    <path fill="#f4d77a" d="M448 448V310c0-58-47-105-105-105h-55v70c0 34 11 66 33 92 31 37 73 64 127 81Z"/>
  </g>

  <text x="174" y="86" fill="#171715" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">OpenMargam</text>
  <text x="174" y="120" fill="#68665f" font-family="Georgia, 'Times New Roman', serif" font-size="21">Find clarity before making a life-shaping decision.</text>
  <text x="54" y="190" fill="#c96343" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2">PROBLEM-FIRST MENTORSHIP</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(54 220)">
      <rect width="190" height="142" rx="14" fill="#ffffff" stroke="#171715" stroke-opacity="0.14"/>
      <text x="20" y="34" fill="#c96343" font-size="12" font-weight="700" letter-spacing="1.4">01</text>
      <text x="20" y="70" fill="#171715" font-size="20" font-weight="700">Your decision</text>
      <text x="20" y="100" fill="#68665f" font-family="Georgia, serif" font-size="16">Start with the real</text>
      <text x="20" y="122" fill="#68665f" font-family="Georgia, serif" font-size="16">choice in front of you.</text>
    </g>
    <path d="M254 291h32" stroke="#c96343" stroke-width="2"/><path d="m278 283 9 8-9 8" fill="none" stroke="#c96343" stroke-width="2"/>
    <g transform="translate(296 220)">
      <rect width="190" height="142" rx="14" fill="#ffffff" stroke="#171715" stroke-opacity="0.14"/>
      <text x="20" y="34" fill="#c96343" font-size="12" font-weight="700" letter-spacing="1.4">02</text>
      <text x="20" y="70" fill="#171715" font-size="20" font-weight="700">Your constraints</text>
      <text x="20" y="100" fill="#68665f" font-family="Georgia, serif" font-size="16">Make time, money, risk,</text>
      <text x="20" y="122" fill="#68665f" font-family="Georgia, serif" font-size="16">and context visible.</text>
    </g>
    <path d="M496 291h32" stroke="#c96343" stroke-width="2"/><path d="m520 283 9 8-9 8" fill="none" stroke="#c96343" stroke-width="2"/>
    <g transform="translate(538 220)">
      <rect width="190" height="142" rx="14" fill="#ffffff" stroke="#171715" stroke-opacity="0.14"/>
      <text x="20" y="34" fill="#c96343" font-size="12" font-weight="700" letter-spacing="1.4">03</text>
      <text x="20" y="70" fill="#171715" font-size="20" font-weight="700">Relevant context</text>
      <text x="20" y="100" fill="#68665f" font-family="Georgia, serif" font-size="16">Learn from experience</text>
      <text x="20" y="122" fill="#68665f" font-family="Georgia, serif" font-size="16">that fits the problem.</text>
    </g>
    <path d="M738 291h32" stroke="#c96343" stroke-width="2"/><path d="m762 283 9 8-9 8" fill="none" stroke="#c96343" stroke-width="2"/>
    <g transform="translate(780 220)">
      <rect width="170" height="142" rx="14" fill="#ffffff" stroke="#171715" stroke-opacity="0.14"/>
      <text x="20" y="34" fill="#c96343" font-size="12" font-weight="700" letter-spacing="1.4">04</text>
      <text x="20" y="70" fill="#171715" font-size="20" font-weight="700">Better questions</text>
      <text x="20" y="100" fill="#68665f" font-family="Georgia, serif" font-size="16">Surface tradeoffs and</text>
      <text x="20" y="122" fill="#68665f" font-family="Georgia, serif" font-size="16">what is still unknown.</text>
    </g>
    <path d="M960 291h32" stroke="#c96343" stroke-width="2"/><path d="m984 283 9 8-9 8" fill="none" stroke="#c96343" stroke-width="2"/>
    <g transform="translate(1002 220)">
      <rect width="144" height="142" rx="14" fill="#171715"/>
      <text x="20" y="34" fill="#f4d77a" font-size="12" font-weight="700" letter-spacing="1.4">05</text>
      <text x="20" y="70" fill="#faf9f5" font-size="20" font-weight="700">Your choice</text>
      <text x="20" y="100" fill="#d5d0c6" font-family="Georgia, serif" font-size="16">Mentors advise.</text>
      <text x="20" y="122" fill="#d5d0c6" font-family="Georgia, serif" font-size="16">You decide.</text>
    </g>
  </g>

  <text x="54" y="406" fill="#68665f" font-family="Arial, Helvetica, sans-serif" font-size="13">Open source · Explainable matching · No platform custody · Self-hostable</text>
</svg>
