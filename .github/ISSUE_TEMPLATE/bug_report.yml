name: Bug report
description: Report a reproducible problem in OpenMargam
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve OpenMargam. Do not include secrets, private data, or vulnerability details. Security reports belong in the private process described in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Provide the smallest reliable set of steps.
      placeholder: |
        1. Go to ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Version or commit
      description: Branch, release, or commit hash where you saw the problem.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, Node version, and deployment method when relevant.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched for an existing issue.
          required: true
        - label: I removed secrets and personal information.
          required: true
