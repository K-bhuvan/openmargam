name: Feature proposal
description: Propose an improvement aligned with the project roadmap
title: "[Proposal]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the user need before describing a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Explain the smallest useful change and alternatives considered.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Privacy and self-hosting impact
      description: Note new data, external services, paid dependencies, or operational requirements.
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Project alignment
      options:
        - label: This preserves the no-commission and no-custody model.
          required: true
        - label: Local development does not require a paid API.
          required: true
        - label: I searched for an existing proposal.
          required: true
