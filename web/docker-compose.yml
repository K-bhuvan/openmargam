services:
  postgres:
    image: postgres:16-alpine
    container_name: openmargam-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: openmargam
    ports:
      - "5432:5432"
    volumes:
      - openmargam_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openmargam"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  openmargam_pgdata:
